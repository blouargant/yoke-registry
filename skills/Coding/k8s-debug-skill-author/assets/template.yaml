# Debug-skill ConfigMap starter.
#
# Save as <chart>/templates/debug-skills/<filename>.yaml (Helm)
# or <kustomize-base>/debug-skills/<filename>.yaml (Kustomize).
#
# Filename convention:
#   * single-variant CM      → <app>-<short-cause>.yaml (orders-api-db-timeout.yaml)
#   * multi-variant family CM → <app>-<family>.yaml     (orders-api-postgres.yaml)
#
# The yoke.dev/debug-skill=true label is the only registration step.
# At runtime, the k8s-debug-skills triage skill discovers this ConfigMap
# by that label and reads data.meta to decide whether it applies.
#
# This file shows the SINGLE-VARIANT form. A MULTI-VARIANT example
# (multiple related errors in one CM, grouped by diagnosis family) is
# appended at the bottom — uncomment whichever block you need.

apiVersion: v1
kind: ConfigMap
metadata:
  name: REPLACE-app-short-cause
  namespace: REPLACE-app-namespace
  labels:
    yoke.dev/debug-skill: "true"
    # Keep the canonical app label on the CM too — useful for kubectl filtering.
    app.kubernetes.io/name: REPLACE-app
    # See ../../k8s-debug-skill-chart-setup/SKILL.md for the labels your
    # Deployments and pod templates must carry for selectors to match.
data:
  # ---------------------------------------------------------------------------
  # meta — the discovery hint. Loaded for every candidate during Phase 1
  # of the k8s-debug-skills triage procedure. Keep it small.
  # ---------------------------------------------------------------------------
  meta: |
    description: one-line summary of when this skill applies

    # Hard filter — at least ONE of `labels` or `image` must be set. When both
    # are present, BOTH must match (AND). Prefer setting both: labels for
    # quick discovery, image for stability against label drift.
    selector:
      labels:
        app.kubernetes.io/name: REPLACE-app
        # app.kubernetes.io/component: api    # optional, narrows further
      image: "REPLACE-registry/REPLACE-app(:|$)"   # regex; matches any container image

    # Optional. Drop the skill if the pod's image tag is outside this range.
    # applies_to: ">=2.4.0 <3.0.0"

    # OR'd. At least one must fire (in addition to selector passing) for the
    # skill to be considered. Prefer specific patterns over generic words.
    matchers:
      - log: "REPLACE specific log fragment, >= 10 chars, regex-friendly"
      # - log: "another representative line"
      # - event: BackOff             # kubernetes event reason
      # - exit_code: 137             # container exit code
      # - container: REPLACE-sidecar # restrict to a specific container

  # ---------------------------------------------------------------------------
  # body — the playbook. Loaded only when this skill is selected. Markdown.
  # Action-oriented. Never instruct the LLM to run mutating commands.
  # ---------------------------------------------------------------------------
  body: |
    # REPLACE-app: REPLACE-one-line-failure-summary

    REPLACE: 1–2 sentences explaining what this error means in the context
    of this specific application — not the generic kubernetes-level meaning.

    Likely causes, in order:

    1. REPLACE-most-likely-cause
    2. REPLACE-second-cause
    3. REPLACE-third-cause

    Safe next step: REPLACE with a single read-only diagnostic (a `kubectl get`,
    a log tail, a health endpoint check). Never a `kubectl delete`, `apply`,
    `patch`, `scale`, `rollout`, or any mutating command.

# ─────────────────────────────────────────────────────────────────────────────
# MULTI-VARIANT EXAMPLE (commented out — adapt instead of the block above
# when you are grouping several related errors into one CM by family).
#
# Group when: errors share kind / source / explanation and a single body
# can cover them with one section per variant. Split into separate CMs
# when likely causes, safe next step, or matcher precision would diverge.
# ─────────────────────────────────────────────────────────────────────────────
#
# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: orders-api-postgres
#   namespace: orders
#   labels:
#     yoke.dev/debug-skill: "true"
#     app.kubernetes.io/name: orders-api
# data:
#   meta: |
#     description: orders-api postgres connectivity failures
#     selector:
#       labels:
#         app.kubernetes.io/name: orders-api
#       image: "myregistry/orders-api(:|$)"
#     matchers:
#       - log: "connection refused.*postgres"   # variant: connection-refused
#       - log: "dial tcp .*: i/o timeout"       # variant: i-o-timeout
#       - log: "FATAL: password authentication" # variant: auth-failed
#       - event: BackOff                        # variant: connection-refused (events too)
#   body: |
#     # orders-api: postgres connectivity
#
#     The pod cannot talk to its Postgres instance. The exact failure mode
#     depends on which matcher fired — see the variant section below.
#
#     ## Variant: connection-refused
#
#     Triggered when log matches: `connection refused.*postgres` or event reason `BackOff`.
#
#     Likely causes:
#     1. The `orders-db` Service has no ready endpoints.
#     2. The Postgres pod is in CrashLoopBackOff.
#
#     Safe next step: `kubectl get endpoints -n orders orders-db`.
#
#     ## Variant: i-o-timeout
#
#     Triggered when log matches: `dial tcp .*: i/o timeout`.
#
#     Likely causes:
#     1. NetworkPolicy `db-allowlist` is rejecting this pod's labels.
#     2. The DB Service IP changed and the app cached the old one.
#
#     Safe next step: `kubectl get networkpolicy -n orders -o yaml | grep -A3 db-allowlist`.
#
#     ## Variant: auth-failed
#
#     Triggered when log matches: `FATAL: password authentication`.
#
#     Likely causes:
#     1. `DATABASE_URL` secret was rotated but pods not restarted.
#     2. The DB user was dropped or its grants revoked.
#
#     Safe next step: `kubectl get secret -n orders orders-db-creds -o jsonpath='{.metadata.resourceVersion}'`
#     and compare with the pod's start time.
